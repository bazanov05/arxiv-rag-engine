services:
  postgres:   
    image: pgvector/pgvector:pg16 
    container_name: films_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - semantic-movie-engine_postgres_data:/var/lib/postgresql/data

volumes:
  semantic-movie-engine_postgres_data:
    external: true