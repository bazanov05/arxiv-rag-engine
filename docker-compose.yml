services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: arxiv_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - semantic-movie-engine_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 4s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: arxiv_rag_app
    stdin_open: true   
    tty: true          
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    volumes:
      - ./src/model/data:/app/src/model/data

volumes:
  semantic-movie-engine_postgres_data:
    external: true